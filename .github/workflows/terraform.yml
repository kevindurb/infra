---
name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          set -euo pipefail
          for root in bootstrap tailnet k8s-backups; do
            ( cd "$root" && terraform init -backend=false -input=false >/dev/null && terraform validate )
          done

  plan:
    name: Plan (${{ matrix.root }})
    needs: check
    # Fork PRs get no variables and no OIDC token, so they cannot authenticate.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Read-only federated identity. The provider ignores `scopes` in
      # federated mode; the credential's scopes are fixed in the console.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TAILSCALE_PLAN_OAUTH_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_PLAN_AUDIENCE }}
    strategy:
      fail-fast: false
      matrix:
        root: [tailnet, k8s-backups]
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        working-directory: ${{ matrix.root }}
        run: terraform init -input=false

      # The plan role cannot write the .tflock object, so plans run unlocked.
      - name: Plan
        working-directory: ${{ matrix.root }}
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > "$RUNNER_TEMP/plan-${{ matrix.root }}.txt"

      - name: Comment plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = `${process.env.RUNNER_TEMP}/plan-${{ matrix.root }}.txt`;
            const plan = fs.readFileSync(planPath, 'utf8').trim();
            const maxLength = 60000;
            const trimmed = plan.length > maxLength
              ? `${plan.slice(0, maxLength)}\n... plan truncated by the workflow`
              : plan;
            const marker = '<!-- terraform-plan:${{ matrix.root }} -->';
            const summary = plan.match(/^(Plan: .+|No changes\.)$/m)?.[0] ?? 'Plan complete';
            const body = [
              marker,
              `### Terraform plan: \`${{ matrix.root }}\``,
              '',
              `**${summary}**`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              trimmed,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  apply:
    name: Apply (${{ matrix.root }})
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Write identity, reachable only through the production environment.
      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TAILSCALE_APPLY_OAUTH_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_APPLY_AUDIENCE }}
    strategy:
      fail-fast: false
      matrix:
        root: [tailnet, k8s-backups]
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Apply
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
