---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  labels: &labels
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector:
        nvidia.com/gpu.present: 'true'
        nvidia.com/gpu.product: NVIDIA-GeForce-GTX-1060-6GB-SHARED
      runtimeClassName: nvidia
      hostname: jellyfin
      securityContext:
        fsGroup: 1000
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: jellyfin-volume
        - name: nfs-media
          persistentVolumeClaim:
            claimName: nfs-media
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:10.10.4@sha256:ea8f8bb0151dcdf6f1aa3669f457a463c68cc13f3e55bb2a2f16be55e86550e7
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            limits:
              memory: 4G
              nvidia.com/gpu: 1
            requests:
              memory: 1G
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: nfs-media
              mountPath: /media
          ports:
            - name: web
              containerPort: 8096
        - name: zap2xml
          image: shuaiscott/zap2xml:latest@sha256:b0376c35ec9c98382c3541b86bfc6602507d9aad257b6b96d2c0debc57685b1b
          volumeMounts:
            - name: config-volume
              mountPath: /data
          envFrom:
            - secretRef:
                name: jellyfin-zap2xml-secret
          env:
            - name: XMLTV_FILENAME
              value: xmltv.xml
